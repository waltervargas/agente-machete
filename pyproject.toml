[project]
name = "agente-machete"
version = "0.1.0"
description = "AI agents you can actually steer. Monadic pipelines, zero infra config."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Walter Vargas", email = "waltervargas@gmail.com"}]

dependencies = [
    "returns>=0.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.50"]
openai = ["openai>=1.0"]
infra = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "hypothesis>=6.0",
    "ruff>=0.8",
]

[project.scripts]
machete = "machete.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machete"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]
