name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/ examples/

      - name: Format (ruff format --check)
        run: uv run ruff format --check src/ tests/ examples/

      - name: Unit tests
        run: uv run python -m pytest tests/ -v --ignore=tests/test_cdk_synth_integration.py

  cdk-integration:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (with infra extras)
        run: uv sync --dev --extra infra

      - name: CDK synthesis integration tests (in-process, no CLI needed)
        run: uv run python -m pytest tests/test_cdk_synth_integration.py -v
